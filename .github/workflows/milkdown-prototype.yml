name: Milkdown prototype

on:
  push:
    branches: [migration/milkdown-mit]
    paths:
      - "prototypes/milkdown/**"
      - ".github/workflows/milkdown-prototype.yml"
  pull_request:
    paths:
      - "prototypes/milkdown/**"
      - ".github/workflows/milkdown-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: prototypes/milkdown
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic dependency lockfile
        run: npm install --package-lock-only
      - name: Commit lockfile
        working-directory: .
        run: |
          if [ -f prototypes/milkdown/package-lock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add prototypes/milkdown/package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: lock prototype dependencies [skip ci]"
              git push
            fi
          fi

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/milkdown
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit findings
        run: |
          npm audit --json > audit-report.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const audit = JSON.parse(fs.readFileSync("audit-report.json", "utf8"));
            console.log("AUDIT_SUMMARY", JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
              console.log("AUDIT_FINDING", JSON.stringify({
                name,
                severity: item.severity,
                isDirect: item.isDirect,
                range: item.range,
                via: item.via.map(v => typeof v === "string" ? {name: v} : {
                  title: v.title, url: v.url, range: v.range, severity: v.severity
                }),
                fixAvailable: item.fixAvailable
              }));
            }
          '
      - name: Type-check and build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Markdown fidelity in Chromium
        run: npm test
      - name: Upload static prototype
        uses: actions/upload-artifact@v4
        with:
          name: khwarizmi-milkdown-prototype
          path: prototypes/milkdown/dist/
          retention-days: 14
