name: Khwarizmi Studio Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/marktext-windows-build.yml"
      - ".gitmodules"
      - "vendor/marktext"
      - "README.md"
      - "scripts/**"
      - "crates/**"
      - "Cargo.toml"
  pull_request:
    paths:
      - ".github/workflows/marktext-windows-build.yml"
      - ".gitmodules"
      - "vendor/marktext"
      - "scripts/**"
      - "crates/**"
      - "Cargo.toml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out Khwarizmi Studio and MarkText
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Khwarizmi branding
        shell: pwsh
        run: ./scripts/patch-marktext.ps1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Test Rust calculation syntax core
        run: cargo test --workspace

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up MSBuild environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        env:
          npm_config_msvs_version: '2022'
        run: pnpm install --frozen-lockfile
        working-directory: vendor/marktext

      - name: Run unit tests
        run: pnpm run test:unit
        working-directory: vendor/marktext

      - name: Build Windows installer
        env:
          npm_config_msvs_version: '2022'
        run: pnpm run build:win
        working-directory: vendor/marktext

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khwarizmi-studio-windows-x64
          path: |
            vendor/marktext/dist/*.exe
            vendor/marktext/dist/*.zip
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
